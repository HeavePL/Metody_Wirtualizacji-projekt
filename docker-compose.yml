name: ewidencja

services:
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://app:${POSTGRES_PASSWORD}@db:5432/worktime
    depends_on:
      db: { condition: service_healthy }
  
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]

  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=worktime
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 2s
volumes:
  pgdata: