<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System ewidencji godzin pracy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Rejestr godzin pracy</h2>
        <form id="form_workDay">
            <input type="text" name="employee_name" id="employee_name" required>
            <input type="date" name="date" id="date" required>
            <input type="time" name="start_hour" id="start_hour" required>
            <input type="time" name="end_hour" id="end_hour" required>
            <textarea name="description" id="description"></textarea>
            <button type="submit" id="btn_submit">Dodaj</button>
        </form>

        <h2>Zarejestrowane godziny pracy</h2>
        <table>
            <thead>
                <tr>
                    <th>Pracownik</th>
                    <th>Data</th>
                    <th>Godziny</th>
                    <th>Opis</th>
                </tr>
            </thead>
            <tbody id="table_godziny_zarejestrowane"></tbody>
        </table>
    </div>
    

</body>
    <script src="script.js"></script>
</html>
